<svg width="1024" height="1024" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Ticketer app icon: cute tiny pixel-art robot carrying a bunch of tickets.
       Blue & white scheme. 32x32 pixel grid scaled to 1024. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- ===== Tickets (a bundle held in front) ===== -->
  <!-- ticket 3 (back) -->
  <rect x="6" y="19" width="13" height="4" fill="#1e3a8a"/>
  <rect x="7" y="19" width="12" height="3" fill="#2563eb"/>
  <!-- ticket 2 (middle) -->
  <rect x="8" y="21" width="15" height="4" fill="#1d4ed8"/>
  <rect x="9" y="22" width="13" height="3" fill="#ffffff"/>
  <rect x="10" y="23" width="7" height="1" fill="#93c5fd"/>
  <!-- ticket 1 (front) -->
  <rect x="10" y="24" width="13" height="4" fill="#2563eb"/>
  <rect x="11" y="25" width="11" height="2" fill="#ffffff"/>
  <rect x="12" y="25" width="6" height="1" fill="#60a5fa"/>
  <!-- notches on front ticket -->
  <rect x="10" y="25" width="1" height="1" fill="#eff6ff"/>
  <rect x="22" y="25" width="1" height="1" fill="#eff6ff"/>

  <!-- ===== Robot ===== -->
  <!-- antenna -->
  <rect x="15" y="2" width="2" height="2" fill="#1e3a8a"/>
  <rect x="15" y="4" width="2" height="1" fill="#1e3a8a"/>
  <rect x="14" y="1" width="4" height="1" fill="#ef4444"/>

  <!-- head -->
  <rect x="10" y="5" width="12" height="9" fill="#1d4ed8"/>
  <rect x="11" y="6" width="10" height="7" fill="#3b82f6"/>
  <!-- face screen -->
  <rect x="12" y="7" width="8" height="5" fill="#0f172a"/>
  <!-- eyes -->
  <rect x="13" y="8" width="2" height="2" fill="#7dd3fc"/>
  <rect x="17" y="8" width="2" height="2" fill="#7dd3fc"/>
  <!-- smile -->
  <rect x="14" y="11" width="4" height="1" fill="#7dd3fc"/>
  <!-- ears/bolts -->
  <rect x="9" y="8" width="1" height="3" fill="#1e3a8a"/>
  <rect x="22" y="8" width="1" height="3" fill="#1e3a8a"/>

  <!-- body -->
  <rect x="11" y="14" width="10" height="5" fill="#1d4ed8"/>
  <rect x="12" y="15" width="8" height="3" fill="#60a5fa"/>

  <!-- arms coming down to hold the bundle -->
  <rect x="7" y="15" width="2" height="5" fill="#1d4ed8"/>
  <rect x="23" y="15" width="2" height="5" fill="#1d4ed8"/>
  <!-- hands -->
  <rect x="6" y="20" width="3" height="2" fill="#3b82f6"/>
  <rect x="23" y="20" width="3" height="2" fill="#3b82f6"/>

  <!-- feet peeking out below the tickets -->
  <rect x="9" y="28" width="3" height="2" fill="#1e3a8a"/>
  <rect x="20" y="28" width="3" height="2" fill="#1e3a8a"/>
</svg>
