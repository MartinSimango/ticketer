<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticketer</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f8ff;
        color: #0f172a;
      }
      .wrap {
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        font-size: 13px;
        color: #64748b;
        margin: 0;
      }
      .spinner {
        margin: 18px auto 0;
        width: 22px;
        height: 22px;
        border: 3px solid #bfdbfe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="logo.svg" alt="Ticketer" width="72" height="72" />
      <h1>Ticketer</h1>
      <p>Starting up…</p>
      <div class="spinner"></div>
    </div>
  </body>
</html>
